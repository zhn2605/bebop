<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byte to Bite</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --fg: #1c1c1a; --mute: #6f6d66; --line: #e3e0d7;
    --soft: #efede6; --accent: #2f5bd3; --accent-fg: #ffffff;
    --ok: #1f7a3a; --ok-bg: #e3f2e7; --bad: #b3261e; --bad-bg: #fbe7e5; --warn: #9a6200; --warn-bg: #fdf0d7;
    --img: #e6e3da; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
    --c1: #8a9bb3; --c2: #c98a12; --c3: #2e9e4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141513; --card: #1d1e1c; --fg: #ecebe6; --mute: #9a988f; --line: #2e2f2c;
      --soft: #262724; --accent: #6f93ff; --accent-fg: #0d1020;
      --ok: #5cc27a; --ok-bg: #1b2e21; --bad: #ff7b6e; --bad-bg: #3a1f1c; --warn: #e8b04d; --warn-bg: #3a2e17;
      --img: #232421; --shadow: none; --c1: #7c8ca3; --c2: #e0a53a; --c3: #5cc27a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, td.num { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12.5px; }
  .mute { color: var(--mute); }

  /* top bar */
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
           flex-wrap: wrap; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; margin-right: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 10px;
          border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #9a9890; flex: none; }
  .led.green { background: #2e9e4f; box-shadow: 0 0 0 3px color-mix(in srgb, #2e9e4f 25%, transparent); }
  .led.yellow { background: #e0a800; box-shadow: 0 0 0 3px color-mix(in srgb, #e0a800 25%, transparent); }
  .led.red { background: #d0362b; box-shadow: 0 0 0 3px color-mix(in srgb, #d0362b 25%, transparent); }
  #program { font-size: 12.5px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 7px 14px; border: 1px solid var(--line); background: var(--card);
           color: var(--fg); border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--mute); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.stop { background: #c62f24; color: #fff; border-color: #c62f24; font-weight: 700; padding: 7px 20px; }
  button.stop:hover { background: #a8261d; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }

  main { max-width: 1440px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 16px;
         grid-template-columns: repeat(12, minmax(0, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; grid-column: span 12; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
       color: var(--mute); margin: 0 0 10px; }
  .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; }
  @media (max-width: 1000px) { .s4, .s5, .s7, .s8 { grid-column: span 12; } }

  /* banner */
  #banner { grid-column: span 12; display: none; padding: 12px 16px; border-radius: 12px;
            font-weight: 600; border: 1px solid; }
  #banner.help { display: block; background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  #banner.stopped { display: block; background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

  /* command */
  #say { display: flex; gap: 8px; }
  #say input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 14px; color: var(--fg);
               background: var(--soft); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  #say input:focus { border-color: var(--accent); background: var(--card); }
  #mic { display: inline-flex; align-items: center; gap: 6px; }
  #mic svg { width: 16px; height: 16px; }
  #mic.rec { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  #mic.rec svg { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { padding: 4px 11px; border-radius: 999px; font-size: 12.5px; background: var(--soft); }
  #hint { margin-top: 10px; font-size: 13px; }
  #heard { margin-top: 4px; font-size: 13px; }

  /* streams */
  .streams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .streams figure { margin: 0; position: relative; }
  .streams img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--img);
                 display: block; border-radius: 8px; }
  .streams figcaption { position: absolute; left: 8px; top: 8px; font-size: 11.5px; font-weight: 600;
                        padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
  .streams .off { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px;
                  background: var(--img); color: var(--mute); font-size: 13px; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .tile .k { font-size: 11.5px; color: var(--mute); }
  .tile.wide { grid-column: 1 / -1; }
  .tile .v { font-size: 17px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child > td, tr:last-child > th { border-bottom: 0; }
  th { color: var(--mute); font-weight: 500; white-space: nowrap; width: 1%; }
  thead th, tr.head th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); }
  #joints td:first-child { white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; min-width: 50px; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--c1); }
  .bar i.bad { background: var(--bad); }

  /* attempts */
  #strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  #strip .att { padding: 4px 10px; font-size: 13px; }
  #strip .att.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  #strip .att.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  #strip .att.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
  #strip label { margin-left: 8px; font-size: 13px; color: var(--mute); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); } .badge.bad { background: var(--bad-bg); }
  .frames { display: flex; gap: 8px; flex-wrap: wrap; }
  .frames a img { height: 120px; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .frames figure { margin: 0; font-size: 11px; color: var(--mute); }
  p.text { margin: 4px 0 12px; white-space: pre-wrap; }
  #detail h2 { margin-top: 14px; }
  #chartbox { position: relative; height: 260px; }
  .scroll { overflow-x: auto; }
  @media (max-width: 600px) { main { padding: 12px 16px 32px; } header { padding: 8px 16px; } }
</style>
</head>
<body>
<header>
  <span class="brand">Byte to Bite</span>
  <span class="pill"><span class="led" id="led"></span><span id="stage">…</span></span>
  <span id="program" class="mute"></span>
  <span class="spacer"></span>
  <button id="btn-resume" title="Clear stop / continue after HELP; the arm goes home slowly">Resume</button>
  <button id="btn-release" title="Torque off: the arm sags">Release torque</button>
  <button class="stop" id="btn-stop" title="Freeze the arm">Stop</button>
</header>
<main>
  <div id="banner"></div>

  <section>
    <h2>Ask the feeder</h2>
    <form id="say" autocomplete="off">
      <input id="say-text" placeholder="e.g. feed me a donut hole" aria-label="Request for the feeder">
      <button type="button" id="mic" title="Record, then click again to transcribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        <span>Speak</span>
      </button>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
    <div class="chips">
      <button type="button" class="chip" data-say="feed me a donut hole">feed me a donut hole</button>
      <button type="button" class="chip" data-say="yes">yes</button>
      <button type="button" class="chip" data-say="continue">continue</button>
    </div>
    <div id="hint" class="mute"></div>
    <div id="heard" class="mute"></div>
  </section>

  <section class="s8">
    <h2>Cameras</h2>
    <div class="streams" id="streams"></div>
  </section>

  <section class="s4">
    <h2>Run</h2>
    <div class="tiles" id="tiles"></div>
    <table id="numbers"></table>
  </section>

  <section class="s5">
    <h2>Arm</h2>
    <table id="joints"></table>
  </section>

  <section class="s7">
    <h2>Error and confidence per attempt</h2>
    <div id="chartbox"><canvas id="chart"></canvas></div>
  </section>

  <section>
    <h2>Attempts</h2>
    <div id="strip"></div>
    <div id="detail"><p class="text mute">No attempts yet.</p></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<script>
const CAMS = ["top", "side", "face"];
const JOINTS = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"];
let attempts = [], sel = -1, live = true, chart = null, lastAttemptsJson = "", state = {};

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function num(x, d = 1) { return (typeof x === "number") ? x.toFixed(d) : (x == null ? "–" : esc(x)); }
function xyz(v) { return Array.isArray(v) ? v.map((x) => num(x, 0)).join(", ") : "–"; }
function compact(o) {
  if (o == null || o === "") return "";
  if (typeof o !== "object") return typeof o === "number" ? num(o, 2) : esc(o);
  if (Array.isArray(o)) return "[" + o.map((x) => (typeof x === "number" ? num(x, 1) : compact(x))).join(", ") + "]";
  return Object.entries(o).map(([k, v]) => `${esc(k)}: ${compact(v)}`).join("; ");
}
function row(k, v, cls = "") { return `<tr><th>${esc(k)}</th><td class="num ${cls}">${v}</td></tr>`; }
function tile(k, v, cls = "") { return `<div class="tile ${cls}"><div class="k">${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`; }
function ago(s) { const m = Math.floor(s / 60); return `${m}:${String(Math.floor(s % 60)).padStart(2, "0")}`; }

function buildStreams(names) {
  $("streams").innerHTML = CAMS.map((c) => names.includes(c)
    ? `<figure><img src="/stream/${c}" alt="${c} camera"><figcaption>${c}</figcaption></figure>`
    : `<figure><div class="off">${c}: not connected</div></figure>`).join("");
}

// What a sentence typed now will do, per the run's on_utterance rules.
function sayHint(s) {
  if (!s.live) return ["Nothing is connected. Start `uv run bebop` (without --task) to take requests here.", false];
  if (!(s.controls || []).includes("say")) return [`${s.source} does not take requests; run \`uv run bebop\`.`, false];
  if (s.stage === "HELP" || s.stage === "STOPPED") return ["Say “continue” to resume.", true];
  if (s.goal === "deliver" && s.stage === "LISTENING") return ["Waiting at the stage pose: “yes” presents the food.", true];
  if ((s.stage === "READY" || s.stage === "LISTENING") && !s.goal) return ["Ready: a request starts a task (plan → grab → deliver).", true];
  return [`Busy (${s.stage}): only “yes” and “continue” are heard right now.`, true];
}

function renderState(s) {
  state = s;
  const cams = (s.cameras || []).join(",");
  if ($("streams").dataset.cams !== cams) { buildStreams(s.cameras || []); $("streams").dataset.cams = cams; }
  $("stage").textContent = s.stage + (s.goal ? ` · ${s.goal}` : "");
  $("led").className = "led " + (s.led || "");
  $("program").textContent = s.source ? `${s.source}${s.live ? "" : " (not connected)"}${s.fake ? " · fake" : ""}` : "";
  const banner = $("banner");
  if (s.help) { banner.className = "help"; banner.textContent = `HELP: ${s.help}`; }
  else if (s.stage === "STOPPED") { banner.className = "stopped"; banner.textContent = `STOPPED${s.reason ? `: ${s.reason}` : ""}. Press Resume or say “continue”.`; }
  else banner.className = "";

  const [hint, can] = sayHint(s);
  $("hint").textContent = hint;
  for (const el of [$("say-text"), $("send"), ...document.querySelectorAll(".chip")]) el.disabled = !can;
  $("mic").disabled = !can || !navigator.mediaDevices;
  if (!navigator.mediaDevices) $("mic").title = "The mic needs http://localhost (or HTTPS) in this browser";
  $("heard").innerHTML = s.voice_error ? `<span class="bad">robot mic down: ${esc(s.voice_error)}</span>`
    : (s.voice ? `Last heard: “${esc(s.voice)}”` : "");

  $("tiles").innerHTML = [
    tile("action", s.action || "–", "wide"),
    tile("attempt", s.attempt ? `${s.attempt} / ${s.max_attempts}` : "–"),
    tile("cost", `$${num(s.cost_usd, 3)}`),
    tile("elapsed", ago(s.elapsed_s || 0)),
  ].join("");
  const flags = Object.entries(s.flags || {}).map(([n, f]) => f.set
    ? `<span class="bad">${esc(n)}</span> (${esc(f.reason)})` : `${esc(n)}: off`).join("<br>");
  const arm = s.arm || {}, tip = arm.tip ? arm.tip.xyz : null, face = s.face || {};
  $("numbers").innerHTML = [
    row("task", esc(s.task || "–")),
    row("mode", esc(s.mode || "–")),
    row("action args", s.action_args && Object.keys(s.action_args).length ? compact(s.action_args) : "–"),
    row("flags", flags || "–"),
    row("gripper xyz", xyz(tip) + (tip ? " mm" : "")),
    row("food xyz", xyz(s.target_xyz) + (s.target_xyz ? " mm" : "")),
    row("error", `${compact(s.err_px) || "–"} px · ${num(s.err_mm)} mm`),
    row("face", face.t ? `${face.present ? "present" : "absent"}, mouth ${face.mouth_open ? "open" : "closed"} (${num(face.mouth_ratio, 2)}), yaw ${num(face.yaw_deg, 0)}°${face.looking_away ? ", looking away" : ""}` : "–"),
    row("distance", s.dist_cm != null ? `${num(s.dist_cm)} cm` : "–"),
    row("last VLM", s.vlm_latency_s != null ? `${num(s.vlm_latency_s, 1)} s, $${num(s.vlm_cost_usd, 3)}` : "–"),
    row("budget", s.budget_usd != null ? `$${num(s.cost_usd, 3)} of $${num(s.budget_usd, 2)}` : "–"),
  ].join("");

  const q = arm.q || {}, goal = arm.goal || {}, load = arm.load || {};
  $("joints").innerHTML = `<tr class="head"><th>joint</th><th>cmd °</th><th>actual °</th><th style="width:auto">load</th></tr>` +
    JOINTS.filter((j) => j in q || j in load).map((j) => {
      const l = load[j], hot = typeof l === "number" && Math.abs(l) > 0.25;
      const pct = typeof l === "number" ? Math.min(100, Math.abs(l) * 100) : 0;
      return `<tr><td>${j.replace("_", " ")}</td><td class="num">${num(goal[j])}</td><td class="num">${num(q[j])}</td>` +
        `<td class="num ${hot ? "bad" : ""}">${num(l, 2)}<div class="bar"><i class="${hot ? "bad" : ""}" style="width:${pct}%"></i></div></td></tr>`;
    }).join("") +
    `<tr><td>gripper mm</td><td></td><td class="num">${num(arm.gripper_mm)}</td><td></td></tr>` +
    `<tr><td>tip pitch °</td><td></td><td class="num">${arm.tip ? num(arm.tip.pitch, 0) : "–"}</td><td></td></tr>`;
}

function attemptOk(a) { return a.ok === true ? "ok" : (a.ok === false ? "bad" : ""); }

function renderStrip() {
  $("strip").innerHTML =
    `<button id="prev" title="← previous">←</button><button id="next" title="→ next">→</button>` +
    attempts.map((a, i) => `<button class="att ${attemptOk(a)} ${i === sel ? "sel" : ""}" data-i="${i}">` +
      `${esc(a.goal === "deliver" ? "D" : "#")}${esc(a.n ?? i + 1)} ${a.ok === true ? "✓" : a.ok === false ? "✗" : "…"}</button>`).join("") +
    `<label><input type="checkbox" id="live" ${live ? "checked" : ""}> Follow live</label>`;
  $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
  $("live").onchange = (e) => { live = e.target.checked; if (live) { sel = attempts.length - 1; renderAll(); } };
  document.querySelectorAll("#strip .att").forEach((b) => b.onclick = () => { live = false; sel = +b.dataset.i; renderAll(); });
}

function renderDetail() {
  const a = attempts[sel];
  if (!a) { $("detail").innerHTML = `<p class="text mute">No attempts yet. Send a request above to start one.</p>`; return; }
  const plan = a.plan || {}, pred = plan.prediction || {}, v = a.verdict || {};
  const rows = (a.results || []).map((r, k) => {
    const act = (plan.actions || [])[k];
    return `<tr><td>${esc(r.name)}</td><td class="num">${compact(act && act.name === r.name ? act.args : r.args)}</td>` +
      `<td class="num">${compact(r.predicted)}</td><td class="num">${compact(r.measured)}</td>` +
      `<td class="num">${compact(r.error)}</td><td class="${r.ok ? "ok" : "bad"}">${r.ok ? "ok" : "fail"}${r.stopped ? " (stopped)" : ""}</td>` +
      `<td>${esc(r.note)}</td></tr>`;
  }).join("");
  const frames = Object.entries(a.frames || {}).map(([k, p]) =>
    `<figure><a href="/frames/${encodeURI(p)}" target="_blank"><img src="/frames/${encodeURI(p)}" alt="${esc(k)}"></a><figcaption>${esc(k)}</figcaption></figure>`).join("");
  const status = a.ok === true ? "succeeded" : a.ok === false ? "failed" : "running";
  $("detail").innerHTML = `
    <table>
      ${row("attempt", `${esc(a.goal)} #${esc(a.n)} · ${esc(a.task || "")} <span class="badge ${attemptOk(a)}">${status}</span>`)}
      ${plan.target ? row("VLM boxes px", compact(plan.target)) : ""}
      ${a.target_xyz ? row("food xyz mm", xyz(a.target_xyz) + (a.width_mm != null ? ` · width ${num(a.width_mm)} mm` : "")) : ""}
      ${pred.success_prob != null ? row("prediction", `p=${num(pred.success_prob, 2)} · expects: ${esc(pred.expected)} · risk: ${esc(pred.risk)}`) : ""}
      ${plan.escalate ? row("escalate", `<span class="bad">${esc(plan.escalate_reason)}</span>`) : ""}
      ${a.verdict ? row("verdict", `<span class="${v.ok ? "ok" : "bad"}">${v.ok ? "yes" : "no"}</span> (${num(v.confidence, 2)}) ${esc(v.note)}`) : ""}
      ${a.note ? row("note", `<span class="bad">${esc(a.note)}</span>`) : ""}
      ${row("VLM", `${num(plan.latency_s, 1)} s, $${num(plan.cost_usd, 3)}`)}
    </table>
    ${plan.reasoning ? `<h2>Reasoning</h2><p class="text">${esc(plan.reasoning)}</p>` : ""}
    ${plan.lesson ? `<h2>Lesson</h2><p class="text">${esc(plan.lesson)}</p>` : ""}
    <h2>Actions</h2>
    <div class="scroll"><table><tr class="head"><th>action</th><th>args</th><th>expected</th><th>measured</th><th>error</th><th>ok</th><th>note</th></tr>${rows}</table></div>
    ${frames ? `<h2>Frames</h2><div class="frames">${frames}</div>` : ""}`;
}

function renderChart() {
  if (typeof Chart === "undefined") return;
  const acq = attempts.filter((a) => a.goal === "acquire");
  const labels = acq.map((a, i) => `#${i + 1}`);
  const err = acq.map((a) => a.err_mm ?? null);
  const prob = acq.map((a) => (a.plan && a.plan.prediction) ? a.plan.prediction.success_prob : null);
  const out = acq.map((a) => a.ok === true ? 1 : a.ok === false ? 0 : null);
  if (!chart) {
    Chart.defaults.color = css("--mute"); Chart.defaults.borderColor = css("--line");
    chart = new Chart($("chart"), {
      data: { labels, datasets: [
        { type: "bar", label: "position error mm", data: err, yAxisID: "mm", backgroundColor: css("--c1"), borderRadius: 4, maxBarThickness: 48 },
        { type: "line", label: "planner's success guess", data: prob, yAxisID: "p", borderColor: css("--c2"), backgroundColor: css("--c2"), showLine: false, pointRadius: 6 },
        { type: "line", label: "outcome (1/0)", data: out, yAxisID: "p", borderColor: css("--c3"), backgroundColor: css("--c3"), showLine: false, pointRadius: 5, pointStyle: "rectRot" },
      ] },
      options: { animation: false, maintainAspectRatio: false,
        plugins: { legend: { labels: { boxWidth: 10, boxHeight: 10 } } },
        scales: { mm: { position: "left", beginAtZero: true, title: { display: true, text: "mm" } },
                  p: { position: "right", min: 0, max: 1, grid: { drawOnChartArea: false } } } },
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = err; chart.data.datasets[1].data = prob; chart.data.datasets[2].data = out;
    chart.update();
  }
}

function renderAll() {
  if (live || sel < 0 || sel >= attempts.length) sel = attempts.length - 1;
  renderStrip(); renderDetail();
}

function go(d) {
  if (!attempts.length) return;
  live = false;
  sel = Math.max(0, Math.min(attempts.length - 1, sel + d));
  renderAll();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

async function post(path, confirmText, body) {
  if (confirmText && !confirm(confirmText)) return false;
  try {
    const r = await fetch(path, body === undefined ? { method: "POST" }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { alert(`${path}: ${(await r.json()).detail || r.status}`); return false; }
    return true;
  } catch (e) { alert(`${path} failed: ${e}`); return false; }
}
$("btn-stop").onclick = () => post("/stop");
$("btn-resume").onclick = () => post("/resume");
$("btn-release").onclick = () => post("/release", "Turn torque off? The arm will sag and fall.");

// -- requests: typed, a chip, or spoken (recorded here, transcribed by the dashboard's whisper) --
async function say(text) {
  text = text.trim();
  if (!text) return;
  if (await post("/say", null, { text })) { $("say-text").value = ""; $("hint").textContent = `Sent: “${text}”`; }
}
$("say").onsubmit = (e) => { e.preventDefault(); say($("say-text").value); };
document.querySelectorAll(".chip").forEach((c) => c.onclick = () => say(c.dataset.say));

let rec = null;
$("mic").onclick = async () => {
  const mic = $("mic"), label = mic.querySelector("span");
  if (rec) { rec.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert(`Microphone: ${e.message || e}`); return; }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    rec = null; mic.classList.remove("rec"); label.textContent = "Transcribing…"; mic.disabled = true;
    try {
      const r = await fetch("/transcribe", { method: "POST", body: new Blob(chunks, { type: chunks[0]?.type || "audio/webm" }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.status);
      // Lands in the box, not straight at the arm: check it, then press Enter.
      $("say-text").value = j.text; $("say-text").focus();
      $("say-text").placeholder = j.text ? "e.g. feed me a donut hole" : "Heard nothing; try again closer to the mic";
    } catch (e) { alert(`Transcription: ${e.message || e}`); }
    label.textContent = "Speak"; mic.disabled = false;
  };
  rec.start(); mic.classList.add("rec"); label.textContent = "Stop & transcribe";
};

async function pollState() {
  try { renderState(await (await fetch("/state")).json()); }
  catch (e) { $("stage").textContent = "dashboard down"; $("streams").dataset.cams = ""; }
  setTimeout(pollState, 500);
}
async function pollAttempts() {
  try {
    const text = await (await fetch("/attempts")).text();
    if (text !== lastAttemptsJson) {
      lastAttemptsJson = text; attempts = JSON.parse(text);
      renderAll(); renderChart();
    }
  } catch (e) { /* the state poll shows the disconnect */ }
  setTimeout(pollAttempts, 1000);
}
pollState(); pollAttempts();
</script>
