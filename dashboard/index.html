<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byte to Bite</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --fg: #111111; --mute: #666666; --line: #cccccc;
    --soft: #f2f2f2; --accent: #111111; --accent-fg: #ffffff;
    --ok: #0a7a2f; --ok-bg: #ffffff; --bad: #c00000; --bad-bg: #ffffff; --warn: #8a5a00; --warn-bg: #fff8e5;
    --img: #e5e5e5; --shadow: none; --c1: #7a8899; --c2: #b07800; --c3: #0a7a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111; --card: #111111; --fg: #e6e6e6; --mute: #8c8c8c; --line: #333333;
      --soft: #1c1c1c; --accent: #e6e6e6; --accent-fg: #111111;
      --ok: #4caf6a; --ok-bg: #111111; --bad: #ff5a4f; --bad-bg: #111111; --warn: #d9a440; --warn-bg: #241d0d;
      --img: #1c1c1c; --c1: #7a8899; --c2: #d9a440; --c3: #4caf6a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, td.num, .tile .v { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .mute { color: var(--mute); }

  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 12px;
           border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-family: ui-monospace, Menlo, monospace; }
  .led { width: 9px; height: 9px; background: #999999; flex: none; }
  .led.green { background: #0a7a2f; } .led.yellow { background: #d9a400; } .led.red { background: #c00000; }
  #program { font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); background: var(--soft);
           color: var(--fg); border-radius: 0; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.stop { background: #c00000; color: #ffffff; border-color: #c00000; font-weight: 600; }
  button.primary { border-color: var(--fg); }

  main { padding: 8px 12px 24px; display: grid; gap: 8px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  section { border: 1px solid var(--line); padding: 8px 10px; min-width: 0; grid-column: span 12; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
  @media (max-width: 1000px) { .s4, .s6 { grid-column: span 12; } }

  /* what the robot is doing, readable from across the room */
  .now { display: flex; align-items: center; gap: 18px; padding: 12px 18px; border: 3px solid var(--now);
         color: var(--now); grid-column: span 12; }
  .now-icon svg { width: 64px; height: 64px; display: block; }
  .now-label { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .now-sub { font-size: 17px; color: var(--fg); margin-top: 3px; }
  .now-meta { margin-left: auto; color: var(--mute); text-align: right; }
  .now.active .now-icon { animation: flash 1.1s ease-in-out infinite; }
  @keyframes flash { 50% { opacity: .2; } }
  .now.thinking { --now: #1f6feb; } .now.moving { --now: #b58100; } .now.delivering { --now: #7b3fd1; }
  .now.done { --now: #148a35; } .now.retry { --now: #d4620a; } .now.help { --now: #d4620a; }
  .now.stopped { --now: #c00000; } .now.listening { --now: #0f8a8a; } .now.ready, .now.idle { --now: #808080; }
  @media (prefers-color-scheme: dark) {
    .now.thinking { --now: #5aa0ff; } .now.moving { --now: #e6b422; } .now.delivering { --now: #b07cff; }
    .now.done { --now: #4cc46c; } .now.retry, .now.help { --now: #ff8c3a; } .now.stopped { --now: #ff5a4f; }
    .now.listening { --now: #3cc6c6; }
  }
  #trend { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  #trend-sub { color: var(--mute); margin-bottom: 6px; }

  #banner { grid-column: span 12; display: none; padding: 6px 10px; border: 1px solid; }
  #banner.help { display: block; background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  #banner.stopped { display: block; color: var(--bad); border-color: var(--bad); }

  #say { display: flex; gap: 6px; }
  #say input { flex: 1; min-width: 0; font: inherit; padding: 4px 8px; color: var(--fg); background: var(--bg);
               border: 1px solid var(--line); border-radius: 0; outline: none; }
  #say input:focus { border-color: var(--fg); }
  #mic { display: inline-flex; align-items: center; gap: 4px; }
  #mic svg { width: 13px; height: 13px; }
  #mic.rec { color: var(--bad); border-color: var(--bad); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 12px; }
  #hint, #heard { margin-top: 4px; font-size: 12px; }

  .streams { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .streams figure { margin: 0; }
  .streams img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--img); display: block; }
  .streams figcaption { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .streams .off { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3;
                  background: var(--img); color: var(--mute); font-size: 12px; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 6px;
           border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .tile { padding: 3px 6px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tile .k { font-size: 11px; color: var(--mute); }
  .tile.wide { grid-column: 1 / -1; }
  .tile .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: normal; white-space: nowrap; width: 1%; }
  thead th, tr.head th { font-size: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #joints td:first-child { white-space: nowrap; }
  .bar { height: 4px; background: var(--soft); min-width: 50px; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--c1); }
  .bar i.bad { background: var(--bad); }

  #strip { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  #strip .att { padding: 1px 6px; font-size: 12px; }
  #strip .att.ok { color: var(--ok); border-color: var(--ok); }
  #strip .att.bad { color: var(--bad); border-color: var(--bad); }
  #strip .att.sel { outline: 1px solid var(--fg); }
  #strip label { margin-left: 6px; font-size: 12px; color: var(--mute); }
  .badge { font-size: 12px; } .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); }
  .frames { display: flex; gap: 6px; flex-wrap: wrap; }
  .frames a img { height: 110px; border: 1px solid var(--line); display: block; }
  .frames figure { margin: 0; font-size: 11px; color: var(--mute); }
  p.text { margin: 2px 0 8px; white-space: pre-wrap; }
  #detail h2 { margin-top: 10px; }
  #chartbox { position: relative; height: 300px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <span class="brand">Byte to Bite</span>
  <span id="program" class="mute"></span>
  <span class="spacer"></span>
  <button id="btn-resume" title="Clear stop / continue after HELP; the arm goes home slowly">Resume</button>
  <button id="btn-release" title="Torque off: the arm sags">Release torque</button>
  <button class="stop" id="btn-stop" title="Freeze the arm">Stop</button>
</header>
<main>
  <section id="now" class="now idle">
    <div class="now-icon" id="now-icon"></div>
    <div><div class="now-label" id="now-label">…</div><div class="now-sub" id="now-sub"></div></div>
    <div class="now-meta mono" id="now-meta"></div>
  </section>

  <section>
    <h2>Cameras</h2>
    <div class="streams" id="streams"></div>
  </section>

  <section class="s6">
    <h2>Attempts</h2>
    <div id="strip"></div>
    <div id="detail"><p class="text mute">No attempts yet.</p></div>
  </section>

  <section class="s6">
    <h2>Gripper-to-food distance when the gripper closed, per try (lower is better)</h2>
    <div id="trend"></div>
    <div id="trend-sub"></div>
    <div id="chartbox"><canvas id="chart"></canvas></div>
  </section>

  <section class="s4">
    <h2>Request</h2>
    <form id="say" autocomplete="off">
      <input id="say-text" placeholder="e.g. feed me a donut hole" aria-label="Request for the feeder">
      <button type="button" id="mic" title="Record, then click again to transcribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        <span>Speak</span>
      </button>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
    <div class="chips">
      <button type="button" class="chip" data-say="feed me a donut hole">feed me a donut hole</button>
      <button type="button" class="chip" data-say="yes">yes</button>
      <button type="button" class="chip" data-say="continue">continue</button>
    </div>
    <div id="hint" class="mute"></div>
    <div id="heard" class="mute"></div>
  </section>

  <section class="s4">
    <h2>Run</h2>
    <div class="tiles" id="tiles"></div>
    <table id="numbers"></table>
  </section>

  <section class="s4">
    <h2>Arm</h2>
    <table id="joints"></table>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<script>
const CAMS = ["top", "side", "face"];
const JOINTS = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"];
let attempts = [], sel = -1, live = true, chart = null, lastAttemptsJson = "", state = {}, lastDone = null;

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function num(x, d = 1) { return (typeof x === "number") ? x.toFixed(d) : (x == null ? "–" : esc(x)); }
function xyz(v) { return Array.isArray(v) ? v.map((x) => num(x, 0)).join(", ") : "–"; }
function compact(o) {
  if (o == null || o === "") return "";
  if (typeof o !== "object") return typeof o === "number" ? num(o, 2) : esc(o);
  if (Array.isArray(o)) return "[" + o.map((x) => (typeof x === "number" ? num(x, 1) : compact(x))).join(", ") + "]";
  return Object.entries(o).map(([k, v]) => `${esc(k)}: ${compact(v)}`).join("; ");
}
function row(k, v, cls = "") { return `<tr><th>${esc(k)}</th><td class="num ${cls}">${v}</td></tr>`; }
function tile(k, v, cls = "") { return `<div class="tile ${cls}"><div class="k">${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`; }
function ago(s) { const m = Math.floor(s / 60); return `${m}:${String(Math.floor(s % 60)).padStart(2, "0")}`; }

function buildStreams(names) {
  $("streams").innerHTML = CAMS.map((c) => names.includes(c)
    ? `<figure><img src="/stream/${c}" alt="${c} camera"><figcaption>${c}</figcaption></figure>`
    : `<figure><div class="off">${c}: not connected</div></figure>`).join("");
}

// What a sentence typed now will do, per the run's on_utterance rules.
function sayHint(s) {
  if (!s.live) return ["Nothing is connected. Start `uv run bebop` (without --task) to take requests here.", false];
  if (!(s.controls || []).includes("say")) return [`${s.source} does not take requests; run \`uv run bebop\`.`, false];
  if (s.stage === "HELP" || s.stage === "STOPPED") return ["Say “continue” to resume.", true];
  if (s.goal === "deliver" && s.stage === "LISTENING") return ["Waiting at the stage pose: “yes” presents the food.", true];
  if ((s.stage === "READY" || s.stage === "LISTENING") && !s.goal) return ["Ready: a request starts a task (plan → grab → deliver).", true];
  return [`Busy (${s.stage}): only “yes” and “continue” are heard right now.`, true];
}

const SVG = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICON = {
  thinking: SVG('<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>'),
  moving: SVG('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
  delivering: SVG('<path d="M7 17 17 7"/><path d="M7 7h10v10"/>'),
  done: SVG('<path d="M20 6 9 17l-5-5"/>'),
  retry: SVG('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
  help: SVG('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
  stopped: SVG('<rect x="5" y="5" width="14" height="14"/>'),
  listening: SVG('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>'),
  ready: SVG('<circle cx="12" cy="12" r="8"/>'),
  idle: SVG('<circle cx="12" cy="12" r="8"/>'),
};
const DOING = {
  plan: "Planning the grab", verify: "Checking the grab", move_to: "Moving above the food",
  open: "Opening the gripper", descend_until_contact: "Lowering onto the food", close: "Closing the gripper",
  lift: "Lifting the food", retract: "Pulling back", home: "Returning home", stage: "Moving in front of the mouth",
  present: "Bringing the food to the mouth", scoop: "Scooping",
};
function doing(action) {
  if (!action) return "";
  if (action.startsWith("intent")) return "Reading the request";
  return DOING[action.split(/[ (:]/)[0]] || action;
}
let flash = null;  // {kind, label, sub, until}: a short "Picked up" / "Missed" after an attempt ends
function renderNow(s) {
  let kind = "ready", label = "Ready", sub = s.task ? `Task: ${s.task}` : "";
  if (flash && Date.now() < flash.until) ({ kind, label, sub } = flash);
  else if (!s.live) { kind = "idle"; label = "Idle"; sub = "Nothing connected"; }
  else if (s.stage === "THINKING") { kind = "thinking"; label = "Thinking…"; sub = doing(s.action); }
  else if (s.stage === "MOVING") { kind = "moving"; label = "Moving"; sub = doing(s.action); }
  else if (s.stage === "PRESENTING") { kind = "delivering"; label = "Delivering"; sub = doing(s.action) || doing("present"); }
  else if (s.stage === "LISTENING") {
    kind = "listening";
    [label, sub] = s.goal === "deliver" ? ["Waiting", "For an open mouth or “yes”"] : ["Listening", "Say or type a request"];
  }
  else if (s.stage === "HELP") { kind = "help"; label = "Needs help"; sub = s.help || ""; }
  else if (s.stage === "STOPPED") { kind = "stopped"; label = "Stopped"; sub = "Press Resume or say “continue”"; }
  $("now").className = `now ${kind}${["thinking", "moving", "delivering"].includes(kind) ? " active" : ""}`;
  $("now-icon").innerHTML = ICON[kind];
  $("now-label").textContent = label;
  $("now-sub").textContent = sub;
  $("now-meta").innerHTML = [s.attempt ? `try ${s.attempt} of ${s.max_attempts}` : "",
    s.source ? `${esc(s.source)}${s.fake ? " (fake)" : ""}` : "", ago(s.elapsed_s || 0)].filter(Boolean).join("<br>");
}

function renderState(s) {
  state = s;
  const cams = (s.cameras || []).join(",");
  if ($("streams").dataset.cams !== cams) { buildStreams(s.cameras || []); $("streams").dataset.cams = cams; }
  renderNow(s);
  $("program").textContent = s.source ? `${s.source}${s.live ? "" : " (not connected)"}${s.fake ? " · fake" : ""}` : "";

  const [hint, can] = sayHint(s);
  $("hint").textContent = hint;
  for (const el of [$("say-text"), $("send"), ...document.querySelectorAll(".chip")]) el.disabled = !can;
  $("mic").disabled = !can || !navigator.mediaDevices;
  if (!navigator.mediaDevices) $("mic").title = "The mic needs http://localhost (or HTTPS) in this browser";
  $("heard").innerHTML = s.voice_error ? `<span class="bad">robot mic down: ${esc(s.voice_error)}</span>`
    : (s.voice ? `Last heard: “${esc(s.voice)}”` : "");

  $("tiles").innerHTML = [
    tile("action", s.action || "–", "wide"),
    tile("attempt", s.attempt ? `${s.attempt} / ${s.max_attempts}` : "–"),
    tile("cost", `$${num(s.cost_usd, 3)}`),
    tile("elapsed", ago(s.elapsed_s || 0)),
  ].join("");
  const flags = Object.entries(s.flags || {}).map(([n, f]) => f.set
    ? `<span class="bad">${esc(n)}</span> (${esc(f.reason)})` : `${esc(n)}: off`).join("<br>");
  const arm = s.arm || {}, tip = arm.tip ? arm.tip.xyz : null, face = s.face || {};
  $("numbers").innerHTML = [
    row("task", esc(s.task || "–")),
    row("mode", esc(s.mode || "–")),
    row("action args", s.action_args && Object.keys(s.action_args).length ? compact(s.action_args) : "–"),
    row("flags", flags || "–"),
    row("gripper xyz", xyz(tip) + (tip ? " mm" : "")),
    row("food xyz", xyz(s.target_xyz) + (s.target_xyz ? " mm" : "")),
    row("error", `${compact(s.err_px) || "–"} px · ${num(s.err_mm)} mm`),
    row("face", face.t ? `${face.present ? "present" : "absent"}, mouth ${face.mouth_open ? "open" : "closed"} (${num(face.mouth_ratio, 2)}), yaw ${num(face.yaw_deg, 0)}°${face.looking_away ? ", looking away" : ""}` : "–"),
    row("distance", s.dist_cm != null ? `${num(s.dist_cm)} cm` : "–"),
    row("last VLM", s.vlm_latency_s != null ? `${num(s.vlm_latency_s, 1)} s, $${num(s.vlm_cost_usd, 3)}` : "–"),
    row("budget", s.budget_usd != null ? `$${num(s.cost_usd, 3)} of $${num(s.budget_usd, 2)}` : "–"),
  ].join("");

  const q = arm.q || {}, goal = arm.goal || {}, load = arm.load || {};
  $("joints").innerHTML = `<tr class="head"><th>joint</th><th>cmd °</th><th>actual °</th><th style="width:auto">load</th></tr>` +
    JOINTS.filter((j) => j in q || j in load).map((j) => {
      const l = load[j], hot = typeof l === "number" && Math.abs(l) > 0.25;
      const pct = typeof l === "number" ? Math.min(100, Math.abs(l) * 100) : 0;
      return `<tr><td>${j.replace("_", " ")}</td><td class="num">${num(goal[j])}</td><td class="num">${num(q[j])}</td>` +
        `<td class="num ${hot ? "bad" : ""}">${num(l, 2)}<div class="bar"><i class="${hot ? "bad" : ""}" style="width:${pct}%"></i></div></td></tr>`;
    }).join("") +
    `<tr><td>gripper mm</td><td></td><td class="num">${num(arm.gripper_mm)}</td><td></td></tr>` +
    `<tr><td>tip pitch °</td><td></td><td class="num">${arm.tip ? num(arm.tip.pitch, 0) : "–"}</td><td></td></tr>`;
}

function attemptOk(a) { return a.ok === true ? "ok" : (a.ok === false ? "bad" : ""); }

function renderStrip() {
  $("strip").innerHTML =
    `<button id="prev" title="← previous">←</button><button id="next" title="→ next">→</button>` +
    attempts.map((a, i) => `<button class="att ${attemptOk(a)} ${i === sel ? "sel" : ""}" data-i="${i}">` +
      `${esc(a.goal === "deliver" ? "D" : "#")}${esc(a.n ?? i + 1)} ${a.ok === true ? "✓" : a.ok === false ? "✗" : "…"}</button>`).join("") +
    `<label><input type="checkbox" id="live" ${live ? "checked" : ""}> Follow live</label>`;
  $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
  $("live").onchange = (e) => { live = e.target.checked; if (live) { sel = attempts.length - 1; renderAll(); } };
  document.querySelectorAll("#strip .att").forEach((b) => b.onclick = () => { live = false; sel = +b.dataset.i; renderAll(); });
}

function renderDetail() {
  const a = attempts[sel];
  if (!a) { $("detail").innerHTML = `<p class="text mute">No attempts yet. Send a request above to start one.</p>`; return; }
  const plan = a.plan || {}, pred = plan.prediction || {}, v = a.verdict || {};
  const rows = (a.results || []).map((r, k) => {
    const act = (plan.actions || [])[k];
    return `<tr><td>${esc(r.name)}</td><td class="num">${compact(act && act.name === r.name ? act.args : r.args)}</td>` +
      `<td class="num">${compact(r.predicted)}</td><td class="num">${compact(r.measured)}</td>` +
      `<td class="num">${compact(r.error)}</td><td class="${r.ok ? "ok" : "bad"}">${r.ok ? "ok" : "fail"}${r.stopped ? " (stopped)" : ""}</td>` +
      `<td>${esc(r.note)}</td></tr>`;
  }).join("");
  const frames = Object.entries(a.frames || {}).map(([k, p]) =>
    `<figure><a href="/frames/${encodeURI(p)}" target="_blank"><img src="/frames/${encodeURI(p)}" alt="${esc(k)}"></a><figcaption>${esc(k)}</figcaption></figure>`).join("");
  const status = a.ok === true ? "succeeded" : a.ok === false ? "failed" : "running";
  $("detail").innerHTML = `
    <table>
      ${row("attempt", `${esc(a.goal)} #${esc(a.n)} · ${esc(a.task || "")} <span class="badge ${attemptOk(a)}">${status}</span>`)}
      ${plan.target ? row("VLM boxes px", compact(plan.target)) : ""}
      ${a.target_xyz ? row("food xyz mm", xyz(a.target_xyz) + (a.width_mm != null ? ` · width ${num(a.width_mm)} mm` : "")) : ""}
      ${pred.success_prob != null ? row("prediction", `p=${num(pred.success_prob, 2)} · expects: ${esc(pred.expected)} · risk: ${esc(pred.risk)}`) : ""}
      ${plan.escalate ? row("escalate", `<span class="bad">${esc(plan.escalate_reason)}</span>`) : ""}
      ${a.verdict ? row("verdict", `<span class="${v.ok ? "ok" : "bad"}">${v.ok ? "yes" : "no"}</span> (${num(v.confidence, 2)}) ${esc(v.note)}`) : ""}
      ${a.note ? row("note", `<span class="bad">${esc(a.note)}</span>`) : ""}
      ${row("VLM", `${num(plan.latency_s, 1)} s, $${num(plan.cost_usd, 3)}`)}
    </table>
    ${plan.reasoning ? `<h2>Reasoning</h2><p class="text">${esc(plan.reasoning)}</p>` : ""}
    ${plan.lesson ? `<h2>Lesson</h2><p class="text">${esc(plan.lesson)}</p>` : ""}
    <h2>Actions</h2>
    <div class="scroll"><table><tr class="head"><th>action</th><th>args</th><th>expected</th><th>measured</th><th>error</th><th>ok</th><th>note</th></tr>${rows}</table></div>
    ${frames ? `<h2>Frames</h2><div class="frames">${frames}</div>` : ""}`;
}

const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(c) {
    const ctx = c.ctx, meta = c.getDatasetMeta(0);
    ctx.save(); ctx.font = "600 14px system-ui, sans-serif"; ctx.fillStyle = css("--fg"); ctx.textAlign = "center";
    meta.data.forEach((pt, i) => {
      const v = c.data.datasets[0].data[i];
      if (v != null) ctx.fillText(`${Math.round(v)} mm`, pt.x, pt.y - 14);
    });
    ctx.restore();
  },
};

function renderChart() {
  // Only the current task's tries: the run keeps every task's attempts, and the trend means
  // something only within one task (its tries restart at #1).
  let start = 0;
  attempts.forEach((a, i) => { if (a.goal === "acquire" && a.n === 1) start = i; });
  const acq = attempts.slice(start).filter((a) => a.goal === "acquire");
  const err = acq.map((a) => a.err_mm ?? null);
  const pts = err.filter((e) => e != null);
  const got = acq.filter((a) => a.ok === true).length;
  if (pts.length >= 2) {
    const first = pts[0], lastE = pts[pts.length - 1], pct = Math.round((lastE - first) / first * 100);
    $("trend").innerHTML = `Off by ${Math.round(first)} mm → ${Math.round(lastE)} mm ` +
      `<span class="${lastE < first ? "ok" : "bad"}">(${pct > 0 ? "+" : ""}${pct}%${lastE < first ? ", improving" : ""})</span>`;
  } else {
    $("trend").textContent = pts.length ? `Off by ${Math.round(pts[0])} mm on try 1` : "No grab tries yet";
  }
  $("trend-sub").textContent = acq.length ? `${got} of ${acq.length} tries grabbed the food. Dot: green = grabbed, red = missed.` : "";
  if (typeof Chart === "undefined") return;
  if (chart) chart.destroy();
  Chart.defaults.color = css("--mute"); Chart.defaults.borderColor = css("--line"); Chart.defaults.font.size = 13;
  const dot = acq.map((a) => a.ok === true ? css("--ok") : a.ok === false ? css("--bad") : css("--mute"));
  chart = new Chart($("chart"), {
    type: "line",
    data: {
      labels: acq.map((_, i) => `Try ${i + 1}`),
      datasets: [
        { label: "gripper-to-food distance (mm)", data: err, yAxisID: "mm", borderColor: css("--c1"), borderWidth: 3,
          pointBackgroundColor: dot, pointBorderColor: dot, pointRadius: 8, spanGaps: true },
        { label: "planner's confidence (%)", yAxisID: "p", borderColor: css("--c2"), borderDash: [6, 4], pointRadius: 3,
          data: acq.map((a) => a.plan && a.plan.prediction && a.plan.prediction.success_prob != null
            ? Math.round(a.plan.prediction.success_prob * 100) : null) },
      ],
    },
    options: {
      animation: false, maintainAspectRatio: false, layout: { padding: { top: 22 } },
      plugins: { legend: { labels: { boxWidth: 14, boxHeight: 3 } } },
      scales: {
        mm: { position: "left", beginAtZero: true, title: { display: true, text: "distance, mm" } },
        p: { position: "right", min: 0, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: "confidence, %" } },
      },
    },
    plugins: [valueLabels],
  });
}

function renderAll() {
  if (live || sel < 0 || sel >= attempts.length) sel = attempts.length - 1;
  renderStrip(); renderDetail();
}

function go(d) {
  if (!attempts.length) return;
  live = false;
  sel = Math.max(0, Math.min(attempts.length - 1, sel + d));
  renderAll();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

async function post(path, confirmText, body) {
  if (confirmText && !confirm(confirmText)) return false;
  try {
    const r = await fetch(path, body === undefined ? { method: "POST" }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { alert(`${path}: ${(await r.json()).detail || r.status}`); return false; }
    return true;
  } catch (e) { alert(`${path} failed: ${e}`); return false; }
}
$("btn-stop").onclick = () => post("/stop");
$("btn-resume").onclick = () => post("/resume");
$("btn-release").onclick = () => post("/release", "Turn torque off? The arm will sag and fall.");

// -- requests: typed, a chip, or spoken (recorded here, transcribed by the dashboard's whisper) --
async function say(text) {
  text = text.trim();
  if (!text) return;
  if (await post("/say", null, { text })) { $("say-text").value = ""; $("hint").textContent = `Sent: “${text}”`; }
}
$("say").onsubmit = (e) => { e.preventDefault(); say($("say-text").value); };
document.querySelectorAll(".chip").forEach((c) => c.onclick = () => say(c.dataset.say));

let rec = null;
$("mic").onclick = async () => {
  const mic = $("mic"), label = mic.querySelector("span");
  if (rec) { rec.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert(`Microphone: ${e.message || e}`); return; }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    rec = null; mic.classList.remove("rec"); label.textContent = "Transcribing…"; mic.disabled = true;
    try {
      const r = await fetch("/transcribe", { method: "POST", body: new Blob(chunks, { type: chunks[0]?.type || "audio/webm" }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.status);
      // Lands in the box, not straight at the arm: check it, then press Enter.
      $("say-text").value = j.text; $("say-text").focus();
      $("say-text").placeholder = j.text ? "e.g. feed me a donut hole" : "Heard nothing; try again closer to the mic";
    } catch (e) { alert(`Transcription: ${e.message || e}`); }
    label.textContent = "Speak"; mic.disabled = false;
  };
  rec.start(); mic.classList.add("rec"); label.textContent = "Stop & transcribe";
};

async function pollState() {
  try { renderState(await (await fetch("/state")).json()); }
  catch (e) { $("now-label").textContent = "Dashboard down"; $("streams").dataset.cams = ""; }
  setTimeout(pollState, 500);
}
async function pollAttempts() {
  try {
    const text = await (await fetch("/attempts")).text();
    if (text !== lastAttemptsJson) {
      lastAttemptsJson = text; attempts = JSON.parse(text);
      const last = attempts[attempts.length - 1], key = last ? `${last.goal}#${last.n}:${last.ok}` : "";
      if (last && last.ok != null && key !== lastDone) {
        if (lastDone !== null) {
          flash = last.ok
            ? { kind: "done", label: last.goal === "deliver" ? "Delivered" : "Picked up", sub: last.task || "" }
            : { kind: "retry", label: "Missed", sub: "Trying again with what it measured" };
          flash.until = Date.now() + 4000;
        }
        lastDone = key;
      }
      renderAll(); renderChart();
    }
  } catch (e) { /* the state poll shows the disconnect */ }
  setTimeout(pollAttempts, 1000);
}
pollState(); pollAttempts();
</script>
