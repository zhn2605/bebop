# Where the tool tip may go (motion/fence.py). Base frame, mm: origin on the table under the pan axis,
# x forward (toward the bowl and the user), y left, z up. Check with tools.arm_check before trusting.

# acquire: the tip may go anywhere the arm can physically reach: a ring around the base axis
# (r = distance from the pan axis, mm) between the heights below. Nothing is refused before an
# attempt except the head zone and the table; IK's "unreachable" is the only other stop.
fence: {r: [90, 600], z: [-30, 450]}  # up to a seated person's mouth
# The calibration sweep visits this box, turned by fence_yaw_deg of shoulder_pan (0 = straight
# ahead of the base, where the plate and cameras are now).
# z: the bottom layer is the food's centre height (the ball must clear the plate), the top a
# bit above the hover; the fit is only trusted between them.
calib_box: {x: [130, 320], y: [-150, 150], z: [-10, 100]}
fence_yaw_deg: 0         # calibration sweeps straight ahead of the base (0 = forward)
# Around the user's head: forbidden except inside the stage -> mouth corridor while delivering.
# Used with taught stage/mouth poses only; a tracked mouth (calibrated face camera) puts a box
# round the head it sees instead (motion/fence.py around_mouth).
# PLACEHOLDER: set it around the seated user's head once `mouth` is taught.
head_zone: {x: [300, 900], y: [-300, 300], z: [180, 900]}
deliver_radius_mm: 40   # radius of the stage -> mouth corridor (flat end at the mouth)
hover_dz: 70            # hover distance back from the target along the gripper before the descent
grasp_clearance_mm: 8   # descents end this far above the table: jaws around the food's lower half
table_z: -30            # SAFE BOUND, NOT MEASURED. Live 2026-11-08: a descent to -32 touched
                        # nothing, and a calibration layer at -75 hit the table and broke the wrist,
                        # so the table is somewhere between. Measure before lowering this:
                        # arm-check, torque off, touch the fixed jaw tip to the plate, read z.
bowl_rim_z: -15         # food-centre height for the top camera alone: table_z + ~15 for donut holes
retract_dz: 60
scoop_pitch: -60        # tool pitch for the scoop dip
# Delivery. With a tracked mouth (core/steps.py deliver_tracked): the stage point is stage_mm out
# from the mouth toward the arm; the food then comes slowly to stop_short_mm from the mouth and
# holds there (it never goes into the mouth: the person leans in). The ultrasonic on the wrist,
# corrected by sensor_behind_food_cm, only acts while the arm moves toward the face: within slow_cm
# it creeps, within stop_short_mm it stops (close enough), within estop_cm on two readings in a
# row it e-stops (the arm goes home). Holding still, the person may come close: a bite is the
# mouth opening, then closing within bite_cm (ultrasonic) or bite_mm (tracked mouth) of the food.
present:
  stop_short_mm: 60
  stage_mm: 150
  slow_cm: 15
  estop_cm: 3
  sensor_behind_food_cm: 10  # PLACEHOLDER: the reading with a card held flat against the food
  reaim_mm: 30               # the head moved this far: back out and aim again (up to `reaims`)
  reaims: 3
  bite_cm: 3
  bite_mm: 35
  bite_timeout_s: 15
  ultrasonic_stop_cm: 6      # taught stage/mouth poses only (no tracked mouth)
  speed: slow
